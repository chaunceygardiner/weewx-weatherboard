# skins/WeatherBoard/lang/en.conf
#
# English -- the reference dictionary.  Every string the boards render is here,
# and nothing else: tests/check_templates.py fails if a key the pages
# render is missing from this file, or if this file carries a key nothing
# renders, and holds every other language to this file's keys.
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key its
# language file does not carry.  {n} is a number; keep it, move it freely.
#
# [Units] [[Ordinates]] is not rendered by the pages themselves: loopdata
# renders this report's live fields in this report's language, and the
# wind direction's .ordinal_compass field reads it.  The words match
# weewx-loopdata's own language files.

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for the wind direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Texts]

    # the page (index.html.tmpl and splitflap.html.tmpl)
    "en" = "en"
    "Current weather conditions, on a board meant to be read across the room." = "Current weather conditions, on a board meant to be read across the room."

    # the readout board's labels and hidden section headings (index.html.tmpl); set in the ordinary text face, so any letter will do
    "Temperature" = "Temperature"
    "OUTSIDE" = "OUTSIDE"
    "DEW POINT" = "DEW POINT"
    "Wind" = "Wind"
    "WIND" = "WIND"
    "GUST 10M" = "GUST 10M"
    "PEAK TODAY" = "PEAK TODAY"
    "Barometer" = "Barometer"
    "BAROMETER" = "BAROMETER"
    "Rain" = "Rain"
    "RAIN TODAY" = "RAIN TODAY"
    "RAIN 24H" = "RAIN 24H"
    "RATE" = "RATE"
    "Sun" = "Sun"
    "UV" = "UV"
    "SUN" = "SUN"
    "Air quality" = "Air quality"
    "AIR QUALITY" = "AIR QUALITY"
    "Comfort" = "Comfort"
    "HUMIDITY" = "HUMIDITY"
    "FEELS LIKE" = "FEELS LIKE"
    "Time" = "Time"

    # the split-flap board's row names (splitflap.html.tmpl); ordinary text face
    "TIME" = "TIME"
    "TEMP" = "TEMP"
    "DEW PT" = "DEW PT"
    "RAIN" = "RAIN"
    "AIR" = "AIR"

    # the status line (board.inc).  These are drawn in the readout board's lettering, League Gothic, which has the Latin
    #    letters and the accented capitals of the Western European languages, and on the split-flap board's twelve
    #    flaps: the tests fail a translation that uses a letter the font does not have, or that runs past twelve
    #    characters with {n} at its widest (59, 59, 23 and 99)
    "%-I:%M:%S %p" = "%-I:%M:%S %p"
    "{n} S AGO" = "{n} S AGO"
    "{n} M AGO" = "{n} M AGO"
    "{n} H AGO" = "{n} H AGO"
    "{n} D AGO" = "{n} D AGO"
    "NO CONNECT" = "NO CONNECT"
    "EXPIRED TAP" = "EXPIRED TAP"
    "WAITING" = "WAITING"

    # words on the split-flap rows (splitflap.inc).  Kept short, since a row is twelve flaps: HI and RH three letters
    #    at most, G one, /HR three, CALM seven, and the air-quality words eight -- the tests hold them to it
    "HI" = "HI"
    "RH" = "RH"
    "CALM" = "CALM"
    "G" = "G"
    "/HR" = "/HR"
    "GOOD" = "GOOD"
    "MODERATE" = "MODERATE"
    "USG" = "USG"
    "UNHLTHY" = "UNHLTHY"
    "V UNHLTH" = "V UNHLTH"
    "HAZARD" = "HAZARD"
