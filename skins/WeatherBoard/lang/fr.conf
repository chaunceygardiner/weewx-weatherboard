# skins/WeatherBoard/lang/fr.conf
#
# French.
#
# See en.conf for how these files work.

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for the wind direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Texts]

    # the page (index.html.tmpl and splitflap.html.tmpl)
    "en" = "fr"
    "Current weather conditions, on a board meant to be read across the room." = "Le temps qu'il fait, sur un tableau fait pour être lu de l'autre bout de la pièce."

    # the LED board's labels and hidden section headings (index.html.tmpl); set in the ordinary text face, so any letter will do
    "Temperature" = "Température"
    "OUTSIDE" = "EXTÉRIEUR"
    "DEW POINT" = "POINT DE ROSÉE"
    "Wind" = "Vent"
    "WIND" = "VENT"
    "GUST 10M" = "RAFALE 10 MIN"
    "PEAK TODAY" = "MAX DU JOUR"
    "Barometer" = "Baromètre"
    "BAROMETER" = "BAROMÈTRE"
    "Rain" = "Pluie"
    "RAIN TODAY" = "PLUIE DU JOUR"
    "RAIN 24H" = "PLUIE 24 H"
    "RATE" = "INTENSITÉ"
    "Sun" = "Soleil"
    "UV" = "UV"
    "SUN" = "SOLEIL"
    "Air quality" = "Qualité de l'air"
    "AIR QUALITY" = "QUALITÉ DE L'AIR"
    "Comfort" = "Confort"
    "HUMIDITY" = "HUMIDITÉ"
    "FEELS LIKE" = "RESSENTI"
    "Time" = "Heure"

    # the split-flap board's row names (splitflap.html.tmpl); ordinary text face
    "TIME" = "HEURE"
    "TEMP" = "TEMP"
    "DEW PT" = "ROSÉE"
    "RAIN" = "PLUIE"
    "AIR" = "AIR"

    # the status line (board.inc).  These are drawn in the LED board's lettering, which has only A-Z, 0-9, the space, . : / and
    #    ? plus the accented capitals it draws itself (Ä Ö Ü Å Ø Á É Í Ó Ú), and on the split-flap board's twelve flaps:
    #    tests/check_templates.py fails a translation that uses any other letter, or that runs past twelve characters
    #    with {n} at its widest (59, 59, 23 and 99)
    "%-I:%M:%S %p" = "%H:%M:%S"
    "{n} S AGO" = "IL Y A {n} S"
    "{n} M AGO" = "IL Y A {n} M"
    "{n} H AGO" = "IL Y A {n} H"
    "{n} D AGO" = "IL Y A {n} J"
    "NO CONNECT" = "HORS LIGNE"
    "EXPIRED TAP" = "TOUCHEZ ICI"
    "WAITING" = "ATTENTE"

    # words on the split-flap rows (splitflap.inc).  Kept short, since a row is twelve flaps: HI and RH three letters
    #    at most, G one, /HR three, CALM seven, and the air-quality words eight -- the tests hold them to it
    "HI" = "MAX"
    "RH" = "HR"
    "CALM" = "CALME"
    "G" = "R"
    "/HR" = "/H"
    "GOOD" = "BON"
    "MODERATE" = "MODÉRÉ"
    "USG" = "SENSIBLE"
    "UNHLTHY" = "MAUVAIS"
    "V UNHLTH" = "T. MAUV."
    "HAZARD" = "DANGER"
