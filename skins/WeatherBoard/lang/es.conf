# skins/WeatherBoard/lang/es.conf
#
# Spanish.
#
# See en.conf for how these files work.

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for the wind direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Texts]

    # the page (index.html.tmpl and splitflap.html.tmpl)
    "en" = "es"
    "Current weather conditions, on a board meant to be read across the room." = "El tiempo actual, en un tablero hecho para leerse desde el otro lado de la sala."

    # the readout board's labels and hidden section headings (index.html.tmpl); set in the ordinary text face, so any letter will do
    "Temperature" = "Temperatura"
    "OUTSIDE" = "EXTERIOR"
    "DEW POINT" = "PUNTO DE ROCÍO"
    "Wind" = "Viento"
    "WIND" = "VIENTO"
    "GUST 10M" = "RÁFAGA 10 MIN"
    "PEAK TODAY" = "MÁXIMA HOY"
    "Barometer" = "Barómetro"
    "BAROMETER" = "BARÓMETRO"
    "Rain" = "Lluvia"
    "RAIN TODAY" = "LLUVIA HOY"
    "RAIN 24H" = "LLUVIA 24 H"
    "RATE" = "INTENSIDAD"
    "Sun" = "Sol"
    "UV" = "UV"
    "SUN" = "SOL"
    "Air quality" = "Calidad del aire"
    "AIR QUALITY" = "CALIDAD DEL AIRE"
    "Comfort" = "Confort"
    "HUMIDITY" = "HUMEDAD"
    "FEELS LIKE" = "SENSACIÓN"
    "Time" = "Hora"

    # the split-flap board's row names (splitflap.html.tmpl); ordinary text face
    "TIME" = "HORA"
    "TEMP" = "TEMP"
    "DEW PT" = "ROCÍO"
    "RAIN" = "LLUVIA"
    "AIR" = "AIRE"

    # the status line (board.inc).  These are drawn in the readout board's lettering, League Gothic, which has the Latin
    #    letters and the accented capitals of the Western European languages, and on the split-flap board's twelve
    #    flaps: the tests fail a translation that uses a letter the font does not have, or that runs past twelve
    #    characters with {n} at its widest (59, 59, 23 and 99)
    "%-I:%M:%S %p" = "%H:%M:%S"
    "{n} S AGO" = "HACE {n} S"
    "{n} M AGO" = "HACE {n} MIN"
    "{n} H AGO" = "HACE {n} H"
    "{n} D AGO" = "HACE {n} D"
    "NO CONNECT" = "SIN CONEXIÓN"
    "EXPIRED TAP" = "TOQUE AQUÍ"
    "WAITING" = "ESPERANDO"

    # words on the split-flap rows (splitflap.inc).  Kept short, since a row is twelve flaps: HI and RH three letters
    #    at most, G one, /HR three, CALM seven, and the air-quality words eight -- the tests hold them to it
    "HI" = "MÁX"
    "RH" = "HR"
    "CALM" = "CALMA"
    "G" = "R"
    "/HR" = "/H"
    "GOOD" = "BUENA"
    "MODERATE" = "MODERADA"
    "USG" = "SENSIBLE"
    "UNHLTHY" = "DAÑINA"
    "V UNHLTH" = "MUY DAÑI"
    "HAZARD" = "PELIGRO"
