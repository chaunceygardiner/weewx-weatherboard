# skins/WeatherBoard/lang/nl.conf
#
# Dutch.
#
# See en.conf for how these files work.

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for the wind direction
        directions = N, NNO, NO, ONO, O, OZO, ZO, ZZO, Z, ZZW, ZW, WZW, W, WNW, NW, NNW, N/A

[Texts]

    # the page (index.html.tmpl and splitflap.html.tmpl)
    "en" = "nl"
    "Current weather conditions, on a board meant to be read across the room." = "Het weer van nu, op een bord dat je vanaf de andere kant van de kamer kunt lezen."

    # the LED board's labels and hidden section headings (index.html.tmpl); set in the ordinary text face, so any letter will do
    "Temperature" = "Temperatuur"
    "OUTSIDE" = "BUITEN"
    "DEW POINT" = "DAUWPUNT"
    "Wind" = "Wind"
    "WIND" = "WIND"
    "GUST 10M" = "WINDSTOOT 10 MIN"
    "PEAK TODAY" = "PIEK VANDAAG"
    "Barometer" = "Luchtdruk"
    "BAROMETER" = "LUCHTDRUK"
    "Rain" = "Regen"
    "RAIN TODAY" = "REGEN VANDAAG"
    "RAIN 24H" = "REGEN 24 U"
    "RATE" = "INTENSITEIT"
    "Sun" = "Zon"
    "UV" = "UV"
    "SUN" = "ZON"
    "Air quality" = "Luchtkwaliteit"
    "AIR QUALITY" = "LUCHTKWALITEIT"
    "Comfort" = "Comfort"
    "HUMIDITY" = "VOCHTIGHEID"
    "FEELS LIKE" = "GEVOELSTEMP"
    "Time" = "Tijd"

    # the split-flap board's row names (splitflap.html.tmpl); ordinary text face
    "TIME" = "TIJD"
    "TEMP" = "TEMP"
    "DEW PT" = "DAUWPUNT"
    "RAIN" = "REGEN"
    "AIR" = "LUCHT"

    # the status line (board.inc).  These are drawn in the LED board's lettering, which has only A-Z, 0-9, the space, . : / and
    #    ? plus the accented capitals it draws itself (Ä Ö Ü Å Ø Á É Í Ó Ú), and on the split-flap board's twelve flaps:
    #    tests/check_templates.py fails a translation that uses any other letter, or that runs past twelve characters
    #    with {n} at its widest (59, 59, 23 and 99)
    "%-I:%M:%S %p" = "%H:%M:%S"
    "{n} S AGO" = "{n} S TERUG"
    "{n} M AGO" = "{n} M TERUG"
    "{n} H AGO" = "{n} U TERUG"
    "{n} D AGO" = "{n} D TERUG"
    "NO CONNECT" = "OFFLINE"
    "EXPIRED TAP" = "TIK HIER"
    "WAITING" = "WACHTEN"

    # words on the split-flap rows (splitflap.inc).  Kept short, since a row is twelve flaps: HI and RH three letters
    #    at most, G one, /HR three, CALM seven, and the air-quality words eight -- the tests hold them to it
    "HI" = "MAX"
    "RH" = "RV"
    "CALM" = "STIL"
    "G" = "S"
    "/HR" = "/U"
    "GOOD" = "GOED"
    "MODERATE" = "MATIG"
    "USG" = "GEVOELIG"
    "UNHLTHY" = "ONGEZOND"
    "V UNHLTH" = "ZEER ONG"
    "HAZARD" = "GEVAAR"
