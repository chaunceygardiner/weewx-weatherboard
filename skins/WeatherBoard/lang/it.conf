# skins/WeatherBoard/lang/it.conf
#
# Italian.
#
# See en.conf for how these files work.

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for the wind direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N.D.

[Texts]

    # the page (index.html.tmpl and splitflap.html.tmpl)
    "en" = "it"
    "Current weather conditions, on a board meant to be read across the room." = "Il tempo attuale, su un tabellone fatto per essere letto dall'altra parte della stanza."

    # the readout board's labels and hidden section headings (index.html.tmpl); set in the ordinary text face, so any letter will do
    "Temperature" = "Temperatura"
    "OUTSIDE" = "ESTERNA"
    "DEW POINT" = "PUNTO DI RUGIADA"
    "Wind" = "Vento"
    "WIND" = "VENTO"
    "GUST 10M" = "RAFFICA 10 MIN"
    "PEAK TODAY" = "PICCO OGGI"
    "Barometer" = "Barometro"
    "BAROMETER" = "BAROMETRO"
    "Rain" = "Pioggia"
    "RAIN TODAY" = "PIOGGIA OGGI"
    "RAIN 24H" = "PIOGGIA 24 H"
    "RATE" = "INTENSITÀ"
    "Sun" = "Sole"
    "UV" = "UV"
    "SUN" = "SOLE"
    "Air quality" = "Qualità dell'aria"
    "AIR QUALITY" = "QUALITÀ DELL'ARIA"
    "Comfort" = "Comfort"
    "HUMIDITY" = "UMIDITÀ"
    "FEELS LIKE" = "PERCEPITA"
    "Time" = "Ora"

    # the split-flap board's row names (splitflap.html.tmpl); ordinary text face
    "TIME" = "ORA"
    "TEMP" = "TEMP"
    "DEW PT" = "RUGIADA"
    "RAIN" = "PIOGGIA"
    "AIR" = "ARIA"

    # the status line (board.inc).  These are drawn in the readout board's lettering, Bebas Neue, which has the Latin
    #    letters and the accented capitals of the Western European languages, and on the split-flap board's twelve
    #    flaps: the tests fail a translation that uses a letter the font does not have, or that runs past twelve
    #    characters with {n} at its widest (59, 59, 23 and 99)
    "%-I:%M:%S %p" = "%H:%M:%S"
    "{n} S AGO" = "{n} S FA"
    "{n} M AGO" = "{n} MIN FA"
    "{n} H AGO" = "{n} ORE FA"
    "{n} D AGO" = "{n} GG FA"
    "NO CONNECT" = "NON CONNESSO"
    "EXPIRED TAP" = "TOCCA QUI"
    "WAITING" = "IN ATTESA"

    # words on the split-flap rows (splitflap.inc).  Kept short, since a row is twelve flaps: HI and RH three letters
    #    at most, G one, /HR three, CALM seven, and the air-quality words eight -- the tests hold them to it
    "HI" = "MAX"
    "RH" = "UR"
    "CALM" = "CALMA"
    "G" = "R"
    "/HR" = "/H"
    "GOOD" = "BUONA"
    "MODERATE" = "MODERATA"
    "USG" = "RISCHIO"
    "UNHLTHY" = "MALSANA"
    "V UNHLTH" = "MOLTO M."
    "HAZARD" = "PERICOLO"
