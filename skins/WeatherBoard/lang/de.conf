# skins/WeatherBoard/lang/de.conf
#
# German.
#
# See en.conf for how these files work.

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for the wind direction
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Texts]

    # the page (index.html.tmpl and splitflap.html.tmpl)
    "en" = "de"
    "Current weather conditions, on a board meant to be read across the room." = "Aktuelles Wetter, auf einer Tafel, die man quer durch den Raum lesen kann."

    # the LED board's labels and hidden section headings (index.html.tmpl); set in the ordinary text face, so any letter will do
    "Temperature" = "Temperatur"
    "OUTSIDE" = "AUSSEN"
    "DEW POINT" = "TAUPUNKT"
    "Wind" = "Wind"
    "WIND" = "WIND"
    "GUST 10M" = "BÖE 10 MIN"
    "PEAK TODAY" = "SPITZE HEUTE"
    "Barometer" = "Luftdruck"
    "BAROMETER" = "LUFTDRUCK"
    "Rain" = "Regen"
    "RAIN TODAY" = "REGEN HEUTE"
    "RAIN 24H" = "REGEN 24 H"
    "RATE" = "REGENRATE"
    "Sun" = "Sonne"
    "UV" = "UV"
    "SUN" = "SONNE"
    "Air quality" = "Luftqualität"
    "AIR QUALITY" = "LUFTQUALITÄT"
    "Comfort" = "Behaglichkeit"
    "HUMIDITY" = "FEUCHTE"
    "FEELS LIKE" = "GEFÜHLT"
    "Time" = "Zeit"

    # the split-flap board's row names (splitflap.html.tmpl); ordinary text face
    "TIME" = "ZEIT"
    "TEMP" = "TEMP"
    "DEW PT" = "TAUPKT"
    "RAIN" = "REGEN"
    "AIR" = "LUFT"

    # the status line (board.inc).  These are drawn in the LED board's lettering, which has only A-Z, 0-9, the space, . : / and
    #    ? plus the accented capitals it draws itself (Ä Ö Ü Å Ø Á É Í Ó Ú), and on the split-flap board's twelve flaps:
    #    tests/check_templates.py fails a translation that uses any other letter, or that runs past twelve characters
    #    with {n} at its widest (59, 59, 23 and 99)
    "%-I:%M:%S %p" = "%H:%M:%S"
    "{n} S AGO" = "VOR {n} S"
    "{n} M AGO" = "VOR {n} MIN"
    "{n} H AGO" = "VOR {n} STD"
    "{n} D AGO" = "VOR {n} TG"
    "NO CONNECT" = "OFFLINE"
    "EXPIRED TAP" = "HIER TIPPEN"
    "WAITING" = "WARTE"

    # words on the split-flap rows (splitflap.inc).  Kept short, since a row is twelve flaps: HI and RH three letters
    #    at most, G one, /HR three, CALM seven, and the air-quality words eight -- the tests hold them to it
    "HI" = "MAX"
    "RH" = "RF"
    "CALM" = "STILL"
    "G" = "B"
    "/HR" = "/H"
    "GOOD" = "GUT"
    "MODERATE" = "MÄSSIG"
    "USG" = "EMPFINDL"
    "UNHLTHY" = "UNGESUND"
    "V UNHLTH" = "SEHR UNG"
    "HAZARD" = "GEFAHR"
