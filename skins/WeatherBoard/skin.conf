# NOTE (paloaltoweather branch): this file carries the live site's values
# (the /loop-data paths) and the indoor board, inout.html.  The master
# branch carries generic public defaults and has no indoor board.

[Extras]
    # Path of loop data file, as a URL the browser resolves.  If not a
    # full path, it is relative to this report's HTML_ROOT.  This branch's
    # loopdata writes to /dev/shm/weewx, served at /loop-data.
    loop_data_file = '/loop-data/loop-data.txt'

    # The indoor board's (inout.html's) four sidecar files, each a small
    # JSON document written outside this skin: the AirGradient trio and
    # the solar array's production.  URL parameters inTempFile, inCO2File,
    # inAQIFile and solarArrayFile override them.
    in_temp_file = '/loop-data/inTemp.txt'
    in_co2_file = '/loop-data/inCO2.txt'
    in_aqi_file = '/loop-data/inAQI.txt'
    solar_array_file = '/loop-data/solar-array.json'

    # How old each sidecar reading may be, in seconds, before it turns to
    # dashes.  The AirGradient trio is written by a ~30 s cron; the solar
    # file is rewritten every 15 s but carries Enphase data already a
    # minute old, hence its larger limit.
    in_temp_max_age = 120
    in_co2_max_age = 120
    in_aqi_max_age = 120
    solar_array_max_age = 150

    # Refresh rate is the rate at which the report should refresh with
    # the latest readings.  A good choice is the rate at which your
    # weather station's driver is feeding loop data.  Expressed in units
    # of seconds.  Default: 2 seconds.
    refresh_rate = 2

    # The title across the top of the board.  Without it the board shows
    # the station's location, from [Station] in weewx.conf.  HTML entities
    # are allowed.
    # title = 'Acme Weather'

    # The browser tab's title.  Without it the tab shows the board's title.
    # meta_title = 'Acme Weather at a Glance'

    # Choose your own password.  Without ?page_update_pwd='xxx'
    # at the end of the URL, auto updating will time out after
    # expiration_time hours.  Note: this password will be visible
    # to users looking at page source in their browser; it is a
    # keep-alive gate, not a secret.
    page_update_pwd = 'foobar'

    # How old (in seconds) a loop record may be before the readings it
    # feeds turn to dashes and the clock gives way to the data's age.
    # Default: 10 seconds.
    max_age = 10

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a tap on the board is needed to
    # start refreshing again.  Default 4 hours.
    expiration_time = 4

    # The clock: 12 or 24 hour.  Left unset, the report's language
    # decides -- 12 hour in English, 24 hour in the others.
    # clock_format = 12

    # The optional readings.  auto shows a reading when the station's
    # current record carries it at report time, so a station without a UV
    # or solar radiation sensor, or without an air quality sensor and the
    # extension that computes its index, never shows an empty panel.  true
    # and false force it.  show_purple, from earlier releases, is still
    # honored as show_aqi.
    show_uv = auto
    show_radiation = auto
    show_aqi = auto

    # If you have a google analytics id, uncomment the following line
    # and fill in the ID.
    # googleAnalyticsId =
    # If you only want to use the ID on a certain host, uncomment the
    # following line and fill in the hostname.
    # analytics_host = www.example.com

# The loopdata fields the boards read, declared to weewx-loopdata (7.0 and
# later), which writes them into loop-data.txt under this report's name,
# rendered with this report's own units and formats.  Named groups, because
# ConfigObj has no line continuation for lists; the names are for the
# reader.  Every field here is read by board.inc, and
# tests/check_templates.py holds the two in step.
#
# current.dateTime.raw is the epoch the age math reads.  The clock is
# current.dateTime.format("%H:%M:%S"): the STATION's time, rendered by
# loopdata through this report's WeeWX formatter, and digits only, so it
# always draws in the board's own lettering; the board lays it out in 12
# or 24 hour form itself.
[LoopData]
    [[fields]]
        clock       = current.dateTime.raw, current.dateTime.format("%H:%M:%S"), current.dateTime.format("%Y-%m-%d")
        temperature = current.outTemp.formatted, current.dewpoint.formatted, current.appTemp.formatted, current.outHumidity.formatted, day.outTemp.max.formatted
        # A station whose driver reports no gusts gets the highest wind
        # speed over the same period instead: loopdata omits the windGust
        # fields there, and the boards fall back to the windSpeed ones.
        wind        = current.windSpeed.formatted, current.windDir.ordinal_compass, 10m.windGust.max.formatted, day.windGust.max.formatted, 10m.windSpeed.max.formatted, day.windSpeed.max.formatted
        barometer   = current.barometer.formatted, trend.barometer.code
        rain        = day.rain.sum.formatted, 24h.rain.sum.formatted, current.rainRate.formatted
        # Declared regardless of the show_ settings: loopdata omits a field
        # whose observation the station does not report.
        sun         = current.UV.formatted, current.radiation.formatted
        air_quality = current.pm2_5_aqi.formatted, current.pm2_5_aqi_color.raw

[CheetahGenerator]
    encoding = html_entities
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[splitflap]]]
            template = splitflap.html.tmpl
        [[[inout]]]
            template = inout.html.tmpl

[CopyGenerator]
    copy_once = favicon.ico, weatherboard.css, inout.css, *.png, fonts/*/*
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
