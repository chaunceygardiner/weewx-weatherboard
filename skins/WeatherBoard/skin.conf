# NOTE (paloaltoweather branch): this file carries John's SITE values
# (/loop-data paths, sidecar file limits, indoor board).  The master branch carries
# generic public defaults and has no indoor board.

[Extras]
    # Path of loop data file, as a URL the browser resolves.  If not a
    # full path, it is relative to this report's HTML_ROOT.  This branch's
    # loopdata writes to /dev/shm/weewx, served at /loop-data.
    loop_data_file = '/loop-data/loop-data.txt'

    # Single-value observation files for the indoor board (index2).
    in_aqi_file = '/loop-data/inAQI.txt'
    in_co2_file = '/loop-data/inCO2.txt'
    in_temp_file = '/loop-data/inTemp.txt'
    solar_array_file = '/loop-data/solar-array.json'

    # Maximum age (seconds) of each sidecar file above before the board
    # shows ?? placeholders for that reading.  One per file: the
    # AirGradient trio is written by a ~30s cron, while the solar array
    # file is rewritten every 15s but carries data the Enphase pipeline
    # has already delayed by the better part of a minute.
    in_temp_max_age = 120
    in_co2_max_age = 120
    in_aqi_max_age = 120
    solar_array_max_age = 150

    # Refresh rate is the rate at which the report should refresh with
    # the latest readings.  A good choice is the rate at which your
    # weather station's driver is feeding loop data.  Expressed in units
    # of seconds.  Default: 2 seconds.
    refresh_rate = 2

    # Fill in a suitable title/subtitle for the report.  Acme Weather is a
    # placeholder; put your own site's name here.
    title = 'Acme Weather WeatherBoard&trade;'
    subtitle = 'Updated continuously.'

    # Title-band theme: 'color' (the default) or 'mono'.  mono paints the
    # whole title band red like the readings: red title, dim-red subtitle,
    # red live label (the age tiers become brightness and blink), and the
    # live logo repainted pure red -- light panel with a dark drawing by
    # day, dark panel with a bright drawing by night.
    title_theme = 'color'

    # Choose your own password.  Without ?page_update_pwd='xxx'
    # at the end of the URL, auto updating will time out after
    # expiration_time hours.  Note: this password will be visible
    # to users looking at page source in their browser; it is a
    # keep-alive gate, not a secret.
    page_update_pwd = 'foobar'

    # How old (in seconds) a loop record may be before the readings it
    # feeds show question marks instead of a value that has stopped
    # being true.  Default: 10 seconds.
    max_age = 10

    # How far behind (in seconds) the clock in the lower right may fall
    # before it reads ??:??:?? in the disconnected blue.  This is longer
    # than max_age on purpose: a reading fifteen seconds old has stopped
    # being true, but a clock fifteen seconds slow is still a good clock.
    # The blue says the board is no longer a clock at all, so save it for
    # a time that would actually mislead you.  Never allowed below
    # max_age, so raising max_age carries the clock up with it.
    # Default: 120 seconds.
    clock_max_age = 120

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a mouse click will be needed
    # to start refreshing again.  Default 4 hours.
    expiration_time = 4

    # If you have a google analytics id, uncomment the following line
    # and fill in the ID.
    # googleAnalyticsId =
    # If you only want to use the ID on a certain host, uncomment the
    # following line and fill in the hostname.
    # analytics_host = www.example.com

    # If a PurpleAir sensor is set up and both weewx-purple and
    # purple-proxy are installed, or just weewx-purple is installed;
    # change the 'False' below to 'True'.
    # The weewx-purple extension can be found here:
    #    https://github.com/chaunceygardiner/weewx-purple
    # The purple-proxy server can be found here:
    #    https://github.com/chaunceygardiner/purple-proxy
    # It is preferable to install both weewx-purple and purple proxy
    # as the proxy returns averages over two minutes (as
    # opposed to one shot readings).
    show_purple = False

# The loopdata fields the board reads, declared to weewx-loopdata (7.0 and
# later), which writes them into loop-data.txt under this report's name,
# rendered with this report's own units and formats.  Named groups, because
# ConfigObj has no line continuation for lists; the names are for the
# reader.  Every field here is read by realtime_updater.inc or
# updater_common.inc, and tests/check_templates.py holds the two in step.
#
# current.dateTime.raw is the epoch the age/LIVE math reads;
# current.dateTime.format("%X") is the clock in the lower right, rendered
# by loopdata through this report's WeeWX formatter so it is the STATION's
# time, not the tablet's.  The board looks for this exact field name, so a
# different strftime string is not a substitute for it: pin one and the
# corner reads ??:??:?? instead.  A locale whose %X carries a timezone (the
# Indian subcontinent and Arabic locales, among others) renders wide enough
# to wrap onto a second line; the lever there is weewxd's LANG.
[LoopData]
    [[fields]]
        clock       = current.dateTime.raw, current.dateTime.format("%X")
        temperature = current.outTemp, current.dewpoint
        wind        = current.windSpeed.formatted, current.windSpeed.raw, current.windDir.ordinal_compass, 10m.windGust.max.formatted, day.windGust.max
        uv          = current.UV.formatted
        barometer   = current.barometer.formatted, trend.barometer.code
        rain        = day.rain.sum.formatted, 24h.rain.sum.formatted, current.rainRate
        # Read only with show_purple set, and declared regardless: loopdata
        # omits a field whose observation the station does not report, so
        # on a station without weewx-purple these never appear in the file.
        air_quality = current.pm2_5_aqi.formatted, current.pm2_5_aqi_color.raw
        # BRANCH ONLY, from here down: the two pages master does not have.
        # The indoor board (index2.html.tmpl) reads the same observations
        # through loopdata's .formatted names -- no unit label, so they fit
        # the narrower cells -- so both spellings are declared or the
        # indoor board comes up all question marks.
        # current.radiation.formatted is the solar reading, which only the
        # indoor board carries.
        indoor      = current.outTemp.formatted, current.dewpoint.formatted, day.windGust.max.formatted, current.rainRate.formatted, current.radiation.formatted
        # The live logo (logo.inc + paw_logo.js) repaints from the same
        # poll: sun and moon position for the sky it draws,
        # humidity/rain/wind for the weather over it.
        logo        = almanac.sun.alt, almanac.sun.az, almanac.moon.alt, almanac.moon.az, almanac.moon.phase, almanac.moon_index, almanac.next_full_moon.unix_epoch.raw, almanac.next_new_moon.unix_epoch.raw, current.outHumidity.raw, current.rainRate.raw

[Labels]
    [[Generic]]
        # Some specialized labels
        air_quality_index = Air Quality Index
        legend            = Legend
        rainToday         = Rain Today
        rain24h           = Rain 24h
        ten_min_max_gust  = 10m Gust
        time_of_day       = Time
        high_gust_today   = Today's High Gust

[CheetahGenerator]
    encoding = html_entities
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[index2]]]
            template = index2.html.tmpl

[CopyGenerator]
    copy_once = favicon.ico, weatherboard.css, paw_logo.js, paw_logo_mono.js, *.png
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
