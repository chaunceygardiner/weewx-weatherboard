<?xml version="1.0" encoding="UTF-8"?>
<!-- Vector source for weatherboard_logo.png, the default title-bar mark.
     Single colour #e51b23 to match the readings.  The cloud is filled
     #000000 rather than left open so it masks the sun behind it; the board's
     background is always black (see weatherboard.css), so the fill reads as
     transparent there.  Re-render at 200x200 for the 100px box on a retina
     tablet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <g fill="none" stroke="#e51b23" stroke-width="6" stroke-linecap="round">
    <circle cx="38" cy="34" r="15"/>
    <path d="M38 8 v7 M38 53 v7 M12 34 h7 M57 34 h7
             M20 16 l5 5 M51 42 l5 5 M56 16 l-5 5 M25 42 l-5 5"/>
  </g>
  <path d="M32 84 a15 15 0 0 1 0-30 a20 20 0 0 1 37-6 a14 14 0 0 1 3 36 z"
        fill="#000000" stroke="#e51b23" stroke-width="6" stroke-linejoin="round"/>
</svg>
